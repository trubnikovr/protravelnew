services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: protravel
      POSTGRES_USER: protravel
      POSTGRES_PASSWORD: protravel
    ports:
      - "5432:5432"
    volumes:
      - protravel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protravel -d protravel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - protravel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  protravel_postgres:
  protravel_redis:
