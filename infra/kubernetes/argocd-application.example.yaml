apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: protravel-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://replace-with-your-git-repository.example/protravel.git
    targetRevision: main
    path: infra/kubernetes/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: protravel-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
