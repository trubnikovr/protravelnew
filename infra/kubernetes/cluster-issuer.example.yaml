apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: ops@protravel.example
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: protravel-public
                namespace: protravel-prod
                kind: Gateway
