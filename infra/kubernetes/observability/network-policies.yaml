apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: protravel-prod
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 3100 }
        - { protocol: TCP, port: 3200 }
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
        - { protocol: TCP, port: 9090 }
        - { protocol: TCP, port: 9464 }
        - { protocol: TCP, port: 13133 }
