---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: tempo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tempo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          args: [-config.file=/etc/tempo/config.yaml]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
          livenessProbe:
            httpGet: { path: /ready, port: http }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo, readOnly: true }
            - { name: data, mountPath: /var/tempo }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          persistentVolumeClaim: { claimName: tempo-data }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: observability-secrets, key: GRAFANA_ADMIN_USER }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: observability-secrets, key: GRAFANA_ADMIN_PASSWORD }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: logs, mountPath: /var/log/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: logs
          emptyDir: { sizeLimit: 1Gi }
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
